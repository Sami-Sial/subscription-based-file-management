name: Build Mobile Apps

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Next.js Client
        working-directory: ./client
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_BACKEND_BASE_URL: https://file-cloud-drive-backend.vercel.app

      - name: Install Mobile Dependencies & Sync Capacitor
        working-directory: ./mobile
        run: |
          npm install
          npx cap sync android

      - name: Build Android APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Next.js Client
        working-directory: ./client
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_BACKEND_BASE_URL: https://file-cloud-drive-backend.vercel.app

      - name: Install Mobile Dependencies & Sync Capacitor
        working-directory: ./mobile
        run: |
          npm install
          npx cap sync ios

      - name: Build iOS App (No Signing)
        working-directory: ./mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
